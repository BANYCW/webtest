<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>学生登录 — 电气/计算机</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#ffffff; --accent:#0b65d8; --muted:#6b7280;
      --radius:12px; font-family: system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    }
    html,body{height:100%; margin:0; background:linear-gradient(180deg,#eef6ff 0%,var(--bg) 100%);} 
    .wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px;}
    .card{
      width:100%; max-width:420px; background:var(--card); border-radius:var(--radius);
      box-shadow:0 8px 30px rgba(19,24,55,0.08); padding:28px; box-sizing:border-box;
    }
    .brand{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
    .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#2bb8ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
    h1{margin:0;font-size:18px}
    p.lead{margin:6px 0 18px;color:var(--muted);font-size:13px}
    form{display:flex;flex-direction:column;gap:12px}
    label{font-size:13px;color:var(--muted)}
    .input, select{
      width:100%; padding:10px 12px; border:1px solid #e6e9ef; border-radius:8px; font-size:14px; box-sizing:border-box;
      background:transparent; outline:none; transition:box-shadow .12s, border-color .12s;
    }
    .input:focus, select:focus{border-color:var(--accent); box-shadow:0 4px 18px rgba(11,101,216,0.12)}
    .row{display:flex;gap:10px}
    .half{flex:1}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
    .btn{
      background:var(--accent); color:#fff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600;
      box-shadow:0 6px 18px rgba(11,101,216,0.14)
    }
    .btn.secondary{background:#eef3ff;color:var(--accent);box-shadow:none;border:1px solid rgba(11,101,216,0.08)}
    .muted-link{font-size:13px;color:var(--muted);text-decoration:none}
    .error{color:#b00020;font-size:13px;margin-top:6px}
    .foot{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
    @media (max-width:420px){ .card{padding:20px} .logo{width:42px;height:42px} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="title">
      <div class="brand">
        <div class="logo">EC</div>
        <div>
          <h1 id="title">学生登录</h1>
          <p class="lead">仅供电气与计算机专业学生使用</p>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <div>
          <label for="major">专业</label>
          <select id="major" name="major" class="input" required>
            <option value="">请选择专业</option>
            <option value="electrical">电气工程及其自动化</option>
            <option value="computer">计算机科学与技术</option>
            <option value="automation">自动化</option>
            <option value="other">其他</option>
          </select>
        </div>

        <div>
          <label for="studentId">学号</label>
          <input id="studentId" name="studentId" class="input" type="text" inputmode="numeric"
                 placeholder="例如：20231234" pattern="^\d{8,12}$" required />
        </div>

        <div>
          <label for="password">密码</label>
          <input id="password" name="password" class="input" type="password" placeholder="请输入密码" minlength="6" required />
        </div>

        <div class="row">
          <label class="half"><input type="checkbox" id="remember" /> <span style="margin-left:8px;font-size:13px;color:var(--muted)">记住我</span></label>
          <div class="half" style="text-align:right">
            <a href="#" class="muted-link">忘记密码？</a>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">登录</button>
          <button type="button" class="btn secondary" id="guestBtn">访客登录</button>
        </div>

        <div id="error" class="error" aria-live="polite" style="display:none"></div>
      </form>

      <div class="foot">首次使用请联系教务或实验室管理员开通账号</div>
    </div>
  </div>

  <script>
    (function(){
      var form = document.getElementById('loginForm');
      var errorEl = document.getElementById('error');
      var guestBtn = document.getElementById('guestBtn');

      function showError(msg){
        errorEl.style.display = msg ? 'block' : 'none';
        errorEl.textContent = msg || '';
      }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        showError('');
        var major = form.major.value.trim();
        var studentId = form.studentId.value.trim();
        var password = form.password.value;

        if(!major){
          showError('请选择专业。'); return;
        }
        if(!/^\d{8,12}$/.test(studentId)){
          showError('请输入 8-12 位数字学号。'); return;
        }
        if(password.length < 6){
          showError('密码长度至少 6 位。'); return;
        }

        // TODO: 替换为真实后端接口
        // 示例：使用 fetch 向 /api/auth/login 发送请求
        fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({major:major, studentId:studentId, password:password, remember: form.remember.checked})
        })
        .then(function(r){
          if(!r.ok) throw new Error('登录失败');
          return r.json();
        })
        .then(function(data){
          // 登录成功后根据后端返回处理，例如跳转
          window.location.href = data.redirect || '/';
        })
        .catch(function(err){
          showError(err.message || '网络或服务器错误，请稍后重试。');
        });
      });

      guestBtn.addEventListener('click', function(){
        // 可用于快速进入演示环境
        fetch('/api/auth/guest', {method:'POST'})
        .then(function(r){ if(r.ok) window.location.href = '/'; else showError('访客登录失败'); })
        .catch(function(){ showError('网络错误，无法访客登录'); });
      });
    })();
  </script>
</body>
</html>
